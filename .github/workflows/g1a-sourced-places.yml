name: g1a sourced places

on:
  pull_request:
  push:

jobs:
  sourced-places:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sourced place id check
        run: node scripts/lint-g1a-sourced-places.mjs
