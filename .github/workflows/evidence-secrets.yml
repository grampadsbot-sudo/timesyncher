name: evidence secrets

on:
  pull_request:
  push:

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PDF text extraction
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Secret patterns
        run: node scripts/test_evidence_secrets.mjs
      - name: Evidence tree
        run: node scripts/check-evidence-secrets.mjs
      - name: Baseline base ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="${{ github.base_ref }}"
          if [ -z "$BASE" ]; then
            BASE=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].base.ref // empty')
          fi
          if [ -z "$BASE" ]; then
            BASE=$(gh pr list --head "${{ github.ref_name }}" --json baseRefName --jq '.[0].baseRefName // empty')
          fi
          if [ -z "$BASE" ]; then
            echo "BASE is unset; subset check cannot run" >&2
            exit 1
          fi
          git fetch origin "$BASE" --depth=1
          echo "BASE=$BASE" >> "$GITHUB_ENV"
      - name: Hard-coded content
        run: |
          node scripts/test_check_hardcoded_content.mjs
          node scripts/check-hardcoded-content.mjs
          node scripts/scan-built-bundles.mjs
      - name: Code ratchet
        run: |
          node scripts/test_check_code_ratchet.mjs
          node scripts/check-code-ratchet.mjs
      - name: Jev card eval gate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JEV_OPENROUTER_API_KEY: ${{ secrets.JEV_OPENROUTER_API_KEY }}
          TIMESYNCHER_JEV_CLASSIFY_TOKEN: ${{ secrets.TIMESYNCHER_JEV_CLASSIFY_TOKEN }}
          TIMESYNCHER_OPENROUTER_API_KEY: ${{ secrets.TIMESYNCHER_OPENROUTER_API_KEY }}
          TIMESYNCHER_JEV_OPENROUTER_API_KEY: ${{ secrets.TIMESYNCHER_JEV_OPENROUTER_API_KEY }}
          TIMESYNCHER_JEV_CLASSIFY_URL: https://openrouter.ai/api/alpha/decisions
        run: node scripts/eval-jev-cards.mjs --gate

  unit-tests:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve Node.js version
        id: node
        run: |
          version=20
          if [ -f .nvmrc ]; then
            version=$(head -n 1 .nvmrc | tr -d '[:space:]')
            version=${version#v}
          elif [ -f package.json ]; then
            engines=$(python3 -c 'import json; print(((json.load(open("package.json")).get("engines") or {}).get("node") or ""))')
            if [ -n "$engines" ]; then
              version=$(printf '%s\n' "$engines" | grep -oE '[0-9]+(\.[0-9]+){0,2}' | head -n 1)
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Using Node.js $version"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Install npm dependencies
        run: npm ci
      - name: PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils python3-reportlab python3-pypdf
      - name: Offline unit tests
        run: node scripts/run-offline-tests.mjs
