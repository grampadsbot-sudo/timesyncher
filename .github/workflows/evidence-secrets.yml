name: evidence secrets

on:
  pull_request:
  push:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PDF text extraction
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Secret patterns
        run: node scripts/test_evidence_secrets.mjs
      - name: Evidence tree
        run: node scripts/check-evidence-secrets.mjs
      - name: Hard-coded content
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE" ]; then git fetch origin "$BASE" --depth=1; fi
          node scripts/test_check_hardcoded_content.mjs
          node scripts/check-hardcoded-content.mjs
          node scripts/scan-built-bundles.mjs

  unit-tests:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve Node.js version
        id: node
        run: |
          version=20
          if [ -f .nvmrc ]; then
            version=$(head -n 1 .nvmrc | tr -d '[:space:]')
            version=${version#v}
          elif [ -f package.json ]; then
            engines=$(python3 -c 'import json; print(((json.load(open("package.json")).get("engines") or {}).get("node") or ""))')
            if [ -n "$engines" ]; then
              version=$(printf '%s\n' "$engines" | grep -oE '[0-9]+(\.[0-9]+){0,2}' | head -n 1)
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Using Node.js $version"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Install npm dependencies
        run: npm ci
      - name: PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils python3-reportlab python3-pypdf
      - name: Offline unit tests
        run: node scripts/run-offline-tests.mjs
