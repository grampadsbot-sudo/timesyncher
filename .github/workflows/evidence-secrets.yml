name: evidence secrets

on:
  pull_request:
  push:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PDF text extraction
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Secret patterns
        run: node scripts/test_evidence_secrets.mjs
      - name: Evidence tree
        run: node scripts/check-evidence-secrets.mjs
      - name: Hard-coded content
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE" ]; then git fetch origin "$BASE" --depth=1; fi
          node scripts/test_check_hardcoded_content.mjs
          node scripts/check-hardcoded-content.mjs
