name: g2b reply literals

on:
  pull_request:
  push:

jobs:
  reply-literals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ban canned join text and trip-named support replies
        run: node scripts/check-g2b-reply-literals.mjs
