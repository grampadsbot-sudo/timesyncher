<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        var embed = false;
        try {
          if (new URLSearchParams(location.search).get('embed') === '1') embed = true;
        } catch (e) {
          embed = false;
        }
        try {
          if (window.top !== window.self) embed = true;
        } catch (e) {
          embed = true;
        }
        if (embed) document.documentElement.setAttribute('data-ts-embed', '1');
        else if (/^\/shared\/[^/]+\/?$/.test(location.pathname)) document.documentElement.setAttribute('data-ts-trip', '1');
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((reg) => reg.unregister()));
        if (window.caches) caches.keys().then((keys) => keys.forEach((key) => caches.delete(key)));
      }
      window.__TS_JOURNEY_BOOK__ = false;
      // QA/CDP: wait for [data-ae-print="1"] or [data-print-ready="style2"] before PDF.
      // If the browser sees Vercel 403 x-vercel-mitigated:deny, send
      // x-vercel-protection-bypass + x-vercel-set-bypass-cookie (Automation Bypass),
      // or Pause System Mitigations on vacation-staging in Vercel Firewall.
      (function () {
        const path = String(location.pathname || '');
        if (!/\/shared\/[^/]+\/journey\/?$/.test(path)) return;
        const params = new URLSearchParams(location.search);
        const style = params.get('style');
        if (style !== '2' && style !== 'style-2' && style !== '1' && style !== 'style-1') return;
        let changed = false;
        if (!params.get('printMode')) {
          params.set('printMode', 'report');
          changed = true;
        }
        if (!params.get('pdfReport')) {
          params.set('pdfReport', (style === '1' || style === 'style-1') ? 'keepsake' : 'keepsake-style-2');
          changed = true;
        }
        if (changed) {
          history.replaceState(null, '', path + '?' + params.toString() + location.hash);
        }
      })();
      if (/\/shared\/[^/]+\/journey\/?$/.test(location.pathname || '')) {
        const slug = String(location.pathname || '').split('/').filter(Boolean).slice(-2, -1)[0] || '';
        const order = document.createElement('a');
        order.href = '/api/keepsake-order?slug=' + encodeURIComponent(slug);
        order.textContent = 'Order Keepsakes';
        order.setAttribute('aria-label', 'Order Keepsakes');
        order.setAttribute('data-keepsake-order', '1');
        order.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:99999;background:#0b3d91;color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;font:600 14px sans-serif';
        document.addEventListener('DOMContentLoaded', () => document.body.appendChild(order));
      }
      function appendSharedTrekBundle() {
        const trek = document.createElement('script');
        trek.type = 'module';
        trek.crossOrigin = 'anonymous';
        trek.src = '/assets/index-BKun7ofk.js';
        document.head.appendChild(trek);
      }
      function showSharedBootError(customerMessage) {
        const root = document.getElementById('root');
        if (!root) return;
        root.replaceChildren();
        const panel = document.createElement('div');
        panel.setAttribute('data-shared-boot-error', '1');
        panel.setAttribute('role', 'alert');
        panel.textContent = customerMessage;
        panel.style.cssText = 'min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#09090b;color:#fff;font:600 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;text-align:center';
        root.appendChild(panel);
        document.documentElement.removeAttribute('data-ts-trip');
      }
      async function readSharedBootCustomerMessage(response) {
        try {
          const payload = await response.json();
          if (payload && payload.customerMessage) return String(payload.customerMessage);
        } catch (e) {
          /* ignore non-JSON boot errors */
        }
        return 'This itinerary is not available right now. Please open the vacation app and try again.';
      }
      (async function bootSharedTrek() {
        const sharedMatch = location.pathname.match(/^\/shared\/([^/]+)/);
        if (!sharedMatch) {
          appendSharedTrekBundle();
          return;
        }
        const token = decodeURIComponent(sharedMatch[1]);
        const response = await fetch(`/api/shared/${encodeURIComponent(token)}/`, { credentials: 'include' });
        if (!response.ok) {
          showSharedBootError(await readSharedBootCustomerMessage(response));
          return;
        }
        const data = await response.json();
        if (!data || !Array.isArray(data.places)) {
          showSharedBootError('This itinerary is not available right now. Please open the vacation app and try again.');
          return;
        }
        appendSharedTrekBundle();
      }()).catch(() => {
        showSharedBootError('This itinerary is not available right now. Please open the vacation app and try again.');
      });
    </script>
    <script src="/ts-timeline-icon-patch.js"></script>
    <script src="/ts-car-brand-filter.js"></script>
    <script src="/ts-thing-media-overlay.js"></script>
    <style>
      [hidden] { display: none !important; }
      html[data-ts-embed] footer[data-build-stamp="1"] {
        visibility: hidden !important;
        position: absolute !important;
        width: 0 !important;
        height: 0 !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        margin: 0 !important;

      html[data-ts-embed] body { padding-bottom: 0 !important; }
      html[data-ts-trip] body {
        height: 100%;

        flex: 1 1 auto;

        -webkit-overflow-scrolling: touch;
      }
      html[data-ts-trip] footer[data-build-stamp="1"] {

        bottom: 0;

        flex: none;

      html[data-ts-trip] body {

      }
      /* SITE: day timeline photo speech-bubble pointer must not clip */
      [data-ts-day-timeline="1"],
      [data-ts-pic-popup="1"] {
        overflow: visible !important;
      }
      [data-ts-pic-popup-tip="1"] {
        box-sizing: content-box !important;
        overflow: visible !important;
      }
      .leaflet-popup-tip,
      .mapboxgl-popup-tip {
        box-sizing: content-box !important;
      }
      .leaflet-popup-tip-container {
        overflow: visible !important;
      }
      [data-ts-logo-chip][data-tab-category] {
        display: inline-flex !important;
        align-items: center !important;

        line-height: 1 !important;

        top: 0 !important;
        align-self: center !important;
      }
      .ts-shared-audio-button {
        width: 30px;
        height: 30px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.07);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(0,0,0,0.18);
        font-size: 15px;
        line-height: 1;
        padding: 0;
      }
      .ts-shared-audio-button[disabled] {
        cursor: not-allowed;
        opacity: .58;
      }
      .ts-shared-audio-button.is-recording {
        background: #b42318;
        border-color: rgba(255,255,255,0.22);
      }
      .ts-shared-audio-toast {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: calc(18px + env(safe-area-inset-bottom));
        z-index: 10000;
        max-width: 520px;
        margin: 0 auto;
        border-radius: 8px;
        background: rgba(15,23,42,.96);
        color: #fff;
        box-shadow: 0 18px 50px rgba(15,23,42,.28);
        padding: 11px 13px;
        font: 700 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        text-align: center;
      }
      .ts-shared-audio-toast.ok {
        background: rgba(6,95,70,.96);
      }
      .ts-shared-audio-toast.error {
        background: rgba(153,27,27,.96);
      }
    </style>
