    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((reg) => reg.unregister()));
        if (window.caches) caches.keys().then((keys) => keys.forEach((key) => caches.delete(key)));
      }
      window.__TS_JOURNEY_BOOK__ = false;
      // QA/CDP: wait for [data-ae-print="1"] or [data-print-ready="style2"] before PDF.
      // If the browser sees Vercel 403 x-vercel-mitigated:deny, send
      // x-vercel-protection-bypass + x-vercel-set-bypass-cookie (Automation Bypass),
      // or Pause System Mitigations on vacation-staging in Vercel Firewall.
      (function () {
        const path = String(location.pathname || '');
        if (!/\/shared\/[^/]+\/journey\/?$/.test(path)) return;
        const params = new URLSearchParams(location.search);
        const style = params.get('style');
        if (style !== '2' && style !== 'style-2' && style !== '1' && style !== 'style-1') return;
        let changed = false;
        if (!params.get('printMode')) {
          params.set('printMode', 'report');
          changed = true;
        }
        if (!params.get('pdfReport')) {
          params.set('pdfReport', (style === '1' || style === 'style-1') ? 'keepsake' : 'keepsake-style-2');
          changed = true;
        }
        if (changed) {
          history.replaceState(null, '', path + '?' + params.toString() + location.hash);
        }
      })();
      if (/\/shared\/[^/]+\/journey\/?$/.test(location.pathname || '')) {
        const slug = String(location.pathname || '').split('/').filter(Boolean).slice(-2, -1)[0] || '';
        const order = document.createElement('a');
        order.href = '/api/keepsake-order?slug=' + encodeURIComponent(slug);
        order.textContent = 'Order Keepsakes';
        order.setAttribute('aria-label', 'Order Keepsakes');
        order.setAttribute('data-keepsake-order', '1');
        order.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:99999;background:#0b3d91;color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;font:600 14px sans-serif';
        document.addEventListener('DOMContentLoaded', () => document.body.appendChild(order));
      }
      (async function bootSharedTrek() {
        const sharedMatch = location.pathname.match(/^\/shared\/([^/]+)/);
        if (sharedMatch) {
          const token = decodeURIComponent(sharedMatch[1]);
          const response = await fetch(`/api/shared/${encodeURIComponent(token)}/`, { credentials: 'include' });
          if (!response.ok) {
            throw new Error(`shared_trip_fetch_failed:${response.status}`);
          }
          const data = await response.json();
          if (!data.liveTabLists || typeof data.liveTabLists !== 'object') {
            throw new Error('shared_live_tab_lists_missing');
          }
          if (!Object.prototype.hasOwnProperty.call(data.liveTabLists, 'hotels')
            || !Object.prototype.hasOwnProperty.call(data.liveTabLists, 'cars')) {
            throw new Error('shared_live_tab_lists_keys_missing');
          }
          window.__TS_SHARED_LIVE_TAB_LISTS__ = data.liveTabLists;
        }
        const trek = document.createElement('script');
        trek.type = 'module';
        trek.crossOrigin = 'anonymous';
        trek.src = '/assets/index-BKun7ofk.js';
        document.head.appendChild(trek);
      }()).catch((error) => {
        console.error(JSON.stringify({
          event: 'shared_live_tab_lists_boot_failed',
          error: String(error?.message || error),
        }));
      });
    </script>

      .ts-shared-audio-button {
        width: 30px;
        height: 30px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.07);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(0,0,0,0.18);
        font-size: 15px;
        line-height: 1;
        padding: 0;
      }
      .ts-shared-audio-button[disabled] {
        cursor: not-allowed;
        opacity: .58;
      }
      .ts-shared-audio-button.is-recording {
        background: #b42318;
        border-color: rgba(255,255,255,0.22);
      }
      .ts-shared-audio-toast {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: calc(18px + env(safe-area-inset-bottom));
        z-index: 10000;
        max-width: 520px;
        margin: 0 auto;
        border-radius: 8px;
        background: rgba(15,23,42,.96);
        color: #fff;
        box-shadow: 0 18px 50px rgba(15,23,42,.28);
        padding: 11px 13px;
        font: 700 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        text-align: center;
      }
      .ts-shared-audio-toast.ok {
        background: rgba(6,95,70,.96);
      }
      .ts-shared-audio-toast.error {
        background: rgba(153,27,27,.96);
      }
    </style>
    <script>
      (() => {
        const sharedMatch = location.pathname.match(/^\/shared\/([^/]+)/);
        if (!sharedMatch) return;
        const shareToken = decodeURIComponent(sharedMatch[1]);
        const maxAudioBytes = 4 * 1024 * 1024;
        let recorder = null;
        let stream = null;
        let chunks = [];
        let startedAt = 0;

        function canRecord() {
          return Boolean(navigator.mediaDevices?.getUserMedia && window.MediaRecorder);
        }

        function setIcon(button, name) {
          if (name === 'stop') {
            button.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.8" fill="currentColor"></rect></svg>';
            return;
          }
          button.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><path d="M12 19v3"></path></svg>';
        }

        function toast(message, tone = '') {
          let el = document.querySelector('.ts-shared-audio-toast');
          if (!el) {
            el = document.createElement('div');
            el.className = 'ts-shared-audio-toast';
            document.body.appendChild(el);
          }
          el.className = `ts-shared-audio-toast ${tone}`.trim();
          el.textContent = message;
          clearTimeout(el.__hideTimer);
          el.__hideTimer = setTimeout(() => el.remove(), tone === 'error' ? 6500 : 4200);
        }

        function preferredType() {
          const options = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
          return options.find((type) => window.MediaRecorder?.isTypeSupported?.(type)) || '';
        }

        function blobToDataUrl(blob) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(reader.error || new Error('Could not read audio note.'));
            reader.readAsDataURL(blob);
          });
        }

        async function submit(blob) {
          const button = document.querySelector('[data-ts-shared-audio]');
          if (button) button.disabled = true;
          toast('Sending voice note...');
          try {
            const audioDataUrl = await blobToDataUrl(blob);
            if (blob.size > maxAudioBytes) {
              throw new Error('Audio note is too large. Please keep recordings under about 45 seconds.');
            }
            const durationSeconds = startedAt ? Math.round((Date.now() - startedAt) / 1000) : null;
            const response = await fetch(`/api/shared/${encodeURIComponent(shareToken)}/audio-note`, {
              method: 'POST',
              credentials: 'include',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ audioDataUrl, durationSeconds }),
            });
            const result = await response.json().catch(() => ({}));
            if (!response.ok || result.ok === false) throw new Error(result.error || 'Could not send voice note.');
            toast('Voice note queued for this itinerary.', 'ok');
          } catch (err) {
            toast(err?.message || 'Could not send voice note.', 'error');
          } finally {
            if (button) {
              button.disabled = false;
              button.classList.remove('is-recording');
              setIcon(button, 'mic');
            }
            startedAt = 0;
          }
        }

        async function start(button) {
          chunks = [];
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const type = preferredType();
          recorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
          recorder.addEventListener('dataavailable', (event) => {
            if (event.data?.size) chunks.push(event.data);
          });
          recorder.addEventListener('stop', () => {
            const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
            stream?.getTracks().forEach((track) => track.stop());
            stream = null;
            submit(blob);
          }, { once: true });
          startedAt = Date.now();
          recorder.start();
          button.classList.add('is-recording');
          setIcon(button, 'stop');
          toast('Recording...');
        }

        async function toggle(event) {
          const button = event.currentTarget;
          if (recorder?.state === 'recording') {
            recorder.stop();
            return;
          }
          try {
            await start(button);
          } catch (err) {
            toast(err?.message || 'Microphone access was blocked.', 'error');
          }
        }

        function installButton() {
          if (document.querySelector('[data-ts-shared-audio]')) return true;
          const tripButton = document.querySelector('[data-trip-view-root]');
          const printButton = document.querySelector('[data-print-menu-root]');
          const row = tripButton?.parentElement || printButton?.parentElement;
          if (!row) return false;
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'ts-shared-audio-button';
          button.dataset.tsSharedAudio = '1';
          button.setAttribute('aria-label', 'Record voice note');
          button.title = 'Record voice note';
          setIcon(button, 'mic');
          if (!canRecord()) {
            button.disabled = true;
            button.title = 'Microphone recording is unavailable in this browser';
          } else {
            button.addEventListener('click', toggle);
          }
          row.insertBefore(button, printButton || null);
          return true;
        }

        const observer = new MutationObserver(() => {
          if (installButton()) observer.disconnect();
        });
        if (!installButton()) observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        function installChrome() {
          if (document.querySelector('[data-ts-guest-nav]')) return true;
          if (!document.body || !(document.body.innerText || '').includes('Day-by-Day')) return false;
          const bar = document.createElement('div');
          bar.dataset.tsGuestNav = '1';
          bar.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:40;display:flex;gap:8px;';
          const guestButtonStyle = 'font:inherit;font-size:13px;font-weight:600;line-height:1.2;padding:10px 14px;border-radius:999px;border:1px solid #d1d5db;background:#fff;color:#111827;box-shadow:0 8px 24px rgba(15,23,42,0.12);cursor:pointer;';
          const navButton = document.createElement('button');
          navButton.type = 'button';
          navButton.textContent = 'Open navigation';
          navButton.setAttribute('aria-label', 'Open navigation');
          navButton.style.cssText = guestButtonStyle;
          const settingsButton = document.createElement('button');
          settingsButton.type = 'button';
          settingsButton.textContent = 'Settings';
          settingsButton.style.cssText = guestButtonStyle;
          const panel = document.createElement('div');
          panel.hidden = true;
          panel.style.cssText = 'position:fixed;right:12px;bottom:56px;z-index:40;background:#fff;color:#111;border:1px solid #d1d5db;border-radius:12px;padding:12px;width:240px;box-shadow:0 18px 45px rgba(15,23,42,0.18);display:flex;flex-direction:column;gap:8px;';
          const panelButtonStyle = 'font:inherit;font-size:13px;font-weight:600;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid #e5e7eb;background:#f8fafc;color:#111827;cursor:pointer;width:100%;';
          function clickTab(label) {
            const button = [...document.querySelectorAll('button')].find((node) => (node.innerText || '').replace(/\s+/g, ' ').trim() === label);
            if (button) button.click();
          }
          navButton.addEventListener('click', () => {
            const open = navButton.getAttribute('aria-label') === 'Open navigation';
            panel.hidden = false;
            panel.innerHTML = '';
            const close = document.createElement('button');
            close.type = 'button';
            close.textContent = open ? 'Close navigation' : 'Open navigation';
            close.setAttribute('aria-label', close.textContent);
            close.style.cssText = panelButtonStyle;
            close.addEventListener('click', () => {
              panel.hidden = true;
              navButton.textContent = 'Open navigation';
              navButton.setAttribute('aria-label', 'Open navigation');
            });
            panel.appendChild(close);
            ['Day-by-Day', 'Flights', 'Hotels', 'Cars', 'Restaurants', 'Stores', 'The Rest'].forEach((label) => {
              const item = document.createElement('button');
              item.type = 'button';
              item.textContent = label;
              item.style.cssText = panelButtonStyle;
              item.addEventListener('click', () => clickTab(label));
              panel.appendChild(item);
            });
            navButton.textContent = 'Close navigation';
            navButton.setAttribute('aria-label', 'Close navigation');
          });
          settingsButton.addEventListener('click', () => {
            panel.hidden = false;
            panel.innerHTML = '';
            ['Mapbox', 'Google Maps', 'Weather', 'Copy link'].forEach((label) => {
              const item = document.createElement('button');
              item.type = 'button';
              item.textContent = label;
              item.style.cssText = panelButtonStyle;
              item.addEventListener('click', async () => {
                if (label === 'Copy link') {
                  try { await navigator.clipboard.writeText(location.href); } catch {}
                  item.textContent = 'Copy link';
                }
                if (label === 'Weather') {
                  const day = [...document.querySelectorAll('button')].find((node) => (node.innerText || '').trim() === 'Day 1');
                  if (day) day.click();
                }
              });
              panel.appendChild(item);
            });
          });
          bar.appendChild(navButton);
          bar.appendChild(settingsButton);
          document.body.appendChild(bar);
          document.body.appendChild(panel);
          return true;
        }
        const timer = setInterval(() => { if (installChrome()) clearInterval(timer); }, 500);
      })();
    </script>
