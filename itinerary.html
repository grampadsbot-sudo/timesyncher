<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TimeSyncher Vacation Itinerary</title>
  <style>
    :root { color-scheme: light; --ink:#18202a; --muted:#667085; --line:#d8dee7; --gold:#a17825; --bg:#f7f8fb; --card:#fff; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
    header { background:#101721; color:#fff; padding:22px clamp(18px, 4vw, 44px); }
    .brand { font-weight:800; letter-spacing:.01em; }
    .wrap { max-width:1060px; margin:0 auto; padding:24px clamp(16px, 4vw, 34px) 48px; }
    h1 { margin:8px 0 6px; font-size:clamp(28px, 4vw, 46px); line-height:1.05; letter-spacing:0; }
    h2 { margin:28px 0 12px; font-size:20px; letter-spacing:0; }
    .muted { color:var(--muted); }
    .summary { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:10px; margin-top:18px; }
    .summary div, .thing { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; }
    .summary span { display:block; color:var(--muted); font-size:12px; text-transform:uppercase; }
    .summary b { display:block; margin-top:3px; }
    .grid { display:grid; gap:12px; }
    .thing { display:grid; gap:7px; }
    .thing h3 { margin:0; font-size:17px; letter-spacing:0; }
    .meta { display:flex; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
    .pill { border:1px solid var(--line); border-radius:999px; padding:3px 8px; background:#fbfcff; }
    .links { display:flex; gap:8px; flex-wrap:wrap; }
    a { color:#71510c; font-weight:700; }
    pre { white-space:pre-wrap; font:inherit; margin:0; color:#313946; }
    .empty { padding:24px; background:#fff; border:1px dashed var(--line); border-radius:8px; }

    .editor-tools { margin:0 0 18px; }
    .audio-note { display:flex; align-items:center; justify-content:space-between; gap:12px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
    .audio-copy { min-width:0; }
    .audio-copy b { display:block; font-size:14px; }
    .audio-copy span { display:block; margin-top:2px; color:var(--muted); font-size:12px; }
    .record-button { appearance:none; border:0; border-radius:999px; min-height:42px; padding:0 14px; background:#101721; color:#fff; font-weight:800; cursor:pointer; white-space:nowrap; }
    .record-button:disabled { cursor:not-allowed; opacity:.58; }
    .record-button.recording { background:#b42318; }
    .record-dot { display:inline-block; width:9px; height:9px; border-radius:999px; background:#e11d48; margin-right:7px; vertical-align:1px; }
    .record-button.recording .record-dot { background:#fff; animation:pulse 1s infinite; }
    .audio-status { min-height:18px; margin-top:8px; color:var(--muted); font-size:12px; }
    .audio-status.error { color:#b42318; }
    .audio-status.ok { color:#067647; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
    @media (max-width:620px) { .audio-note { align-items:stretch; flex-direction:column; } .record-button { width:100%; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">TimeSyncher Vacation</div>
    <h1 id="title">Vacation Itinerary</h1>
    <div id="subtitle" class="muted"></div>
  </header>
  <main class="wrap">
    <section class="summary" id="summary"></section>
    <section id="editorTools" class="editor-tools" hidden>
      <div class="audio-note">
        <div class="audio-copy">
          <b>Audio update</b>
          <span id="audioStatus">Ready to record an itinerary change.</span>
        </div>
        <button id="recordButton" class="record-button" type="button"><span class="record-dot"></span>Record update</button>
      </div>
    </section>
    <div id="content" class="grid"><div class="empty">Loading itinerary...</div></div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const session = params.get('session') || params.get('token') || '';
    const names = { note:'Planning Notes', transport:'Flights & Transportation', hotel:'Hotels & Lodging', activity:'Activities & Daily Plan', restaurant:'Restaurants', shopping:'Shopping', other:'Other' };
    const order = ['note','transport','hotel','activity','restaurant','shopping','other'];
    const safe = (value) => String(value || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const dateText = (value) => value ? new Date(value).toLocaleString([], { dateStyle:'medium', timeStyle:'short' }) : '';

    let tripId = '';
    let recorder = null;
    let recordStartedAt = 0;
    let audioStream = null;
    let audioChunks = [];
    const editorTools = document.getElementById('editorTools');
    const recordButton = document.getElementById('recordButton');
    const audioStatus = document.getElementById('audioStatus');
    function setAudioStatus(message, tone = '') {
      audioStatus.textContent = message;
      audioStatus.className = `audio-status ${tone}`.trim();
    }
    function preferredAudioMimeType() {
      const options = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
      return options.find((type) => window.MediaRecorder?.isTypeSupported?.(type)) || '';
    }
    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error('Could not read audio note.'));
        reader.readAsDataURL(blob);
      });
    }
    function collectVoicePageContext(data) {
      const sections = data?.sections || {};
      const items = [];
      Object.entries(sections).forEach(([section, sectionItems]) => {
        (Array.isArray(sectionItems) ? sectionItems : []).forEach((thing) => {
          items.push({
            id: thing.id || thing.placeId || thing.place_id || '',
            title: thing.title || thing.name || '',
            description: thing.description || thing.summary || thing.notes || '',
            category: thing.category || thing.subtype || section,
            day: thing.day || thing.dayNumber || thing.day_number || null,
            time: thing.time || thing.startTime || thing.place_time || null,
            scope: section,
          });
        });
      });
      return { source: 'shared_itinerary_page_voice_button', trip: data?.trip || null, items };
    }
    async function checkAudioAccess(data) {
      tripId = data.trip?.id || '';
      if (!tripId || !navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return;
      try {
        const res = await fetch(`/api/vacation-web-access?action=status&tripId=${encodeURIComponent(tripId)}`, { credentials: 'include' });
        const status = await res.json();
        const role = String(status.role || '').toLowerCase();
        const allowedRole = role === 'owner' || role === 'telegram_collaborator' || role === 'web_editor';
        if (status.ok && status.canEdit && allowedRole) editorTools.hidden = false;
      } catch {
        editorTools.hidden = true;
      }
    }
    async function submitAudioNote(blob) {
      setAudioStatus('Transcribing and queuing update...');
      recordButton.disabled = true;
      try {
        const audioDataUrl = await blobToDataUrl(blob);
        const durationSeconds = recordStartedAt ? Math.round((Date.now() - recordStartedAt) / 1000) : null;
        const res = await fetch('/api/vacation-itinerary', {
          method: 'POST',
          credentials: 'include',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ action: 'upload_audio_note', session, audioDataUrl, durationSeconds, pageContext: window.__timesyncherVoicePageContext || null }),
        });
        const result = await res.json().catch(() => ({}));
        if (!res.ok || result.ok === false) throw new Error(result.error || 'Could not send audio update.');
        setAudioStatus('Queued. TimeSyncher is applying that update.', 'ok');
      } catch (error) {
        setAudioStatus(error.message || 'Could not send audio update.', 'error');
      } finally {
        recordButton.disabled = false;
        recordButton.innerHTML = '<span class="record-dot"></span>Record update';
        recordButton.classList.remove('recording');
        recordStartedAt = 0;
      }
    }
    async function startRecording() {
      audioChunks = [];
      audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeType = preferredAudioMimeType();
      recorder = new MediaRecorder(audioStream, mimeType ? { mimeType } : undefined);
      recorder.addEventListener('dataavailable', (event) => {
        if (event.data?.size) audioChunks.push(event.data);
      });
      recorder.addEventListener('stop', () => {
        const blob = new Blob(audioChunks, { type: recorder.mimeType || 'audio/webm' });
        audioStream?.getTracks().forEach((track) => track.stop());
        audioStream = null;
        submitAudioNote(blob);
      }, { once: true });
      recordStartedAt = Date.now();
      recorder.start();
      recordButton.classList.add('recording');
      recordButton.innerHTML = '<span class="record-dot"></span>Stop and send';
      setAudioStatus('Recording...');
    }
    async function toggleRecording() {
      if (recorder?.state === 'recording') {
        recorder.stop();
        return;
      }
      try {
        await startRecording();
      } catch (error) {
        setAudioStatus(error.message || 'Microphone access was blocked.', 'error');
      }
    }
    recordButton.addEventListener('click', toggleRecording);
    function renderThing(thing) {
      const links = Array.isArray(thing.links) ? thing.links : [];
      return `<article class="thing">
        <div class="meta">
          <span class="pill">${safe(thing.subtype || thing.category)}</span>
          ${thing.metadata?.status ? `<span class="pill">${safe(thing.metadata.status)}</span>` : ''}
          ${thing.metadata?.sourceBacked ? '<span class="pill">source-backed</span>' : ''}
        </div>
        <h3>${safe(thing.title)}</h3>
        ${thing.description ? `<pre>${safe(thing.description)}</pre>` : ''}
        ${links.length ? `<div class="links">${links.map((link, index) => `<a href="${safe(link.url || link.href)}" target="_blank" rel="noreferrer">${safe(link.label || link.title || `Source ${index + 1}`)}</a>`).join('')}</div>` : ''}
      </article>`;
    }
    async function load() {
      if (!session) throw new Error('Missing itinerary session token.');
      const res = await fetch(`/api/vacation-itinerary?session=${encodeURIComponent(session)}`);
      const data = await res.json();
      if (!res.ok || data.ok === false) throw new Error(data.error || 'Unable to load itinerary.');
      document.getElementById('title').textContent = data.trip.title || 'Vacation Itinerary';
      document.getElementById('subtitle').textContent = [data.trip.destination, data.trip.travelerName].filter(Boolean).join(' · ');
      document.getElementById('summary').innerHTML = [
        ['Destination', data.trip.destination || 'In progress'],
        ['Start', data.trip.startDate || 'To confirm'],
        ['Status', data.trip.status || 'Planning'],
        ['Updated', new Date(data.generatedAt).toLocaleString()]
      ].map(([label, value]) => `<div><span>${label}</span><b>${safe(value)}</b></div>`).join('');
      window.__timesyncherVoicePageContext = collectVoicePageContext(data);
      checkAudioAccess(data);
      const sections = data.sections || {};
      const html = order.filter((key) => sections[key]?.length).map((key) => `<section><h2>${names[key] || key}</h2><div class="grid">${sections[key].map(renderThing).join('')}</div></section>`).join('');
      document.getElementById('content').innerHTML = html || '<div class="empty">The itinerary is being built. Check back in a few minutes.</div>';
    }
    load().catch((error) => {
      document.getElementById('content').innerHTML = `<div class="empty">${safe(error.message)}</div>`;
    });
  </script>
</body>
</html>
