<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TimeSyncher Vacation Itinerary</title>
  <style>
    :root { color-scheme: light; --ink:#18202a; --muted:#667085; --line:#d8dee7; --gold:#a17825; --bg:#f7f8fb; --card:#fff; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
    header { background:#101721; color:#fff; padding:22px clamp(18px, 4vw, 44px); }
    .brand { font-weight:800; letter-spacing:.01em; }
    .wrap { max-width:1060px; margin:0 auto; padding:24px clamp(16px, 4vw, 34px) 48px; }
    h1 { margin:8px 0 6px; font-size:clamp(28px, 4vw, 46px); line-height:1.05; letter-spacing:0; }
    h2 { margin:28px 0 12px; font-size:20px; letter-spacing:0; }
    .muted { color:var(--muted); }
    .summary { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:10px; margin-top:18px; }
    .summary div, .thing { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; }
    .summary span { display:block; color:var(--muted); font-size:12px; text-transform:uppercase; }
    .summary b { display:block; margin-top:3px; }
    .grid { display:grid; gap:12px; }
    .thing { display:grid; gap:7px; }
    .thing h3 { margin:0; font-size:17px; letter-spacing:0; }
    .meta { display:flex; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
    .pill { border:1px solid var(--line); border-radius:999px; padding:3px 8px; background:#fbfcff; }
    .links { display:flex; gap:8px; flex-wrap:wrap; }
    a { color:#71510c; font-weight:700; }
    pre { white-space:pre-wrap; font:inherit; margin:0; color:#313946; }
    .empty { padding:24px; background:#fff; border:1px dashed var(--line); border-radius:8px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">TimeSyncher Vacation</div>
    <h1 id="title">Vacation Itinerary</h1>
    <div id="subtitle" class="muted"></div>
  </header>
  <main class="wrap">
    <section class="summary" id="summary"></section>
    <div id="content" class="grid"><div class="empty">Loading itinerary...</div></div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const session = params.get('session') || params.get('token') || '';
    const names = { note:'Planning Notes', transport:'Flights & Transportation', hotel:'Hotels & Lodging', activity:'Activities & Daily Plan', restaurant:'Restaurants', shopping:'Shopping', other:'Other' };
    const order = ['note','transport','hotel','activity','restaurant','shopping','other'];
    const safe = (value) => String(value || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const dateText = (value) => value ? new Date(value).toLocaleString([], { dateStyle:'medium', timeStyle:'short' }) : '';
    function renderThing(thing) {
      const links = Array.isArray(thing.links) ? thing.links : [];
      return `<article class="thing">
        <div class="meta">
          <span class="pill">${safe(thing.subtype || thing.category)}</span>
          ${thing.metadata?.status ? `<span class="pill">${safe(thing.metadata.status)}</span>` : ''}
          ${thing.metadata?.sourceBacked ? '<span class="pill">source-backed</span>' : ''}
        </div>
        <h3>${safe(thing.title)}</h3>
        ${thing.description ? `<pre>${safe(thing.description)}</pre>` : ''}
        ${links.length ? `<div class="links">${links.map((link, index) => `<a href="${safe(link.url || link.href)}" target="_blank" rel="noreferrer">${safe(link.label || link.title || `Source ${index + 1}`)}</a>`).join('')}</div>` : ''}
      </article>`;
    }
    async function load() {
      if (!session) throw new Error('Missing itinerary session token.');
      const res = await fetch(`/api/vacation-itinerary?session=${encodeURIComponent(session)}`);
      const data = await res.json();
      if (!res.ok || data.ok === false) throw new Error(data.error || 'Unable to load itinerary.');
      document.getElementById('title').textContent = data.trip.title || 'Vacation Itinerary';
      document.getElementById('subtitle').textContent = [data.trip.destination, data.trip.travelerName].filter(Boolean).join(' · ');
      document.getElementById('summary').innerHTML = [
        ['Destination', data.trip.destination || 'In progress'],
        ['Start', data.trip.startDate || 'To confirm'],
        ['Status', data.trip.status || 'Planning'],
        ['Updated', new Date(data.generatedAt).toLocaleString()]
      ].map(([label, value]) => `<div><span>${label}</span><b>${safe(value)}</b></div>`).join('');
      const sections = data.sections || {};
      const html = order.filter((key) => sections[key]?.length).map((key) => `<section><h2>${names[key] || key}</h2><div class="grid">${sections[key].map(renderThing).join('')}</div></section>`).join('');
      document.getElementById('content').innerHTML = html || '<div class="empty">The itinerary is being built. Check back in a few minutes.</div>';
    }
    load().catch((error) => {
      document.getElementById('content').innerHTML = `<div class="empty">${safe(error.message)}</div>`;
    });
  </script>
</body>
</html>
