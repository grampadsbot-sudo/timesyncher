<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vacay Keepsake admin</title>
  <link rel="stylesheet" href="/brand/vk-wordmark.css" />
  <link rel="stylesheet" href="/vacation-app-shell.css" />
  <link rel="stylesheet" href="/chat-composer/chat-composer.css" />
  <link rel="stylesheet" href="/vk-admin-review.css" />
  <link rel="stylesheet" href="/ts-build-stamp-customer-hide.css" />
  <script src="/ts-build-stamp-customer-hide.js"></script>
  <style>
    :root { color-scheme: light; --ink: #15191f; --muted: #677280; --line: #d9e0e8; --gold-strong: #8b6518; --paper: #f6f7f9; --panel: #ffffff; --soft: #eef2f6; --blue: #2f6f9f; --danger: #a23a2a; }
    html, body { height: 100%; margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: var(--paper); color: var(--ink); }
    .app { height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .workspace { display: grid; grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr); min-height: 0; }
    .workspace.chat-only { grid-template-rows: minmax(0, 1fr); }
    .site-pane { min-height: 0; overflow: auto; background: var(--panel); border-bottom: 1px solid var(--line); }
    .chat-pane { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; background: var(--panel); }
    .messages { min-height: 0; overflow: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
    .bubble { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #f9fafb; line-height: 1.42; white-space: pre-wrap; }
    .bubble.user { background: #e8f1f7; align-self: flex-end; }
    .bubble small { display: block; color: var(--muted); font-weight: 750; margin-bottom: 3px; }
    .topbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.94); }
    .splitter-row { min-height: 44px; }
    .splitter { width: 100%; border: 0; border-top: 1px solid #cdd5df; background: linear-gradient(180deg, #edf1f5, #dfe6ee); min-height: 44px; cursor: row-resize; position: relative; }
    .splitter::after { content: ""; position: absolute; left: 50%; top: 50%; width: 54px; height: 3px; border-radius: 999px; background: #9ca8b5; transform: translate(-50%, -50%); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/vacation-app-request.js"></script>
  <script src="/chat-composer/chat-composer.js"></script>
  <script src="/vk-admin-review.js"></script>
  <script>
    window.startVkAdminReview(document.getElementById('root'));
  </script>
</body>
</html>
