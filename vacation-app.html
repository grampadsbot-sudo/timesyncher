<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vacay Keepsake App</title>
  <link rel="stylesheet" href="/brand/vk-wordmark.css" />
  <link rel="stylesheet" href="/vacation-app-shell.css" />
  <style>
    :root {
      color-scheme: light;
      --ink: #15191f;
      --muted: #677280;
      --line: #d9e0e8;
      --gold: #b4872d;
      --gold-strong: #8b6518;
      --paper: #f6f7f9;
      --panel: #ffffff;
      --soft: #eef2f6;
      --blue: #2f6f9f;
      --danger: #a23a2a;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button, input, textarea { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    .app {
      height: 100vh;
      height: 100dvh;
      box-sizing: border-box;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }
    .topbar {
      grid-row: 1;
      min-height: 0;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px clamp(12px, 3vw, 22px);
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(14px);
      z-index: 4;
      min-width: 0;
    }
    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 850;
    }
    .mark {
      width: 34px;
      height: 34px;
      object-fit: contain;
      display: block;
      flex: 0 0 auto;
    }
    .brand small {
      display: block;
      color: var(--muted);
      font-weight: 650;
      font-size: 12px;
      margin-top: 1px;
    }
    .vacation-dropdown { position: relative; flex: 1 1 auto; min-width: 0; max-width: min(52vw, 280px); margin-left: auto; }
    .trip-button {
      width: 100%;
      max-width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      font-weight: 750;
    }
    .trip-button span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .trip-list {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      width: min(92vw, 420px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 22px 70px rgba(24, 32, 42, .18);
      padding: 8px;
      transform-origin: top right;
      transform: scale(.94) translateY(-8px);
      opacity: 0; visibility: hidden;
      pointer-events: none;
      transition: transform .16s ease, opacity .16s ease;
      z-index: 8;
    }
    .vacation-dropdown.open .trip-list {
      transform: scale(1) translateY(0);
      opacity: 1; visibility: visible;
      pointer-events: auto;
    }
    .trip-option {
      width: 100%;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--ink);
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      padding: 10px;
      text-align: left;
    }
    .trip-option:hover, .trip-option.active { background: var(--soft); }
    .trip-option b, .trip-option small {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .trip-option small { color: var(--muted); margin-top: 2px; }
    .workspace {
      grid-row: 2;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, var(--site-height, 52fr)) auto minmax(0, var(--chat-height, 48fr));
    }
    .workspace.chat-only {
      grid-template-rows: minmax(0, 1fr);
    }
    .site-pane, .chat-pane {
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    .site-pane {
      background: #dce2ea;
      position: relative;
    }
    .fullscreen-button {
      position: absolute;
      z-index: 3;
      top: auto;
      bottom: 8px;
      right: 8px;
      min-width: 42px;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      font-weight: 750;
      padding: 0 clamp(6px, 1.5vw, 10px);
      font-size: clamp(11px, 2.8vw, 14px);
      white-space: nowrap;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: white;
    }
    .splitter {
      border: 0;
      border-top: 1px solid #cdd5df;
      border-bottom: 1px solid #cdd5df;
      background: linear-gradient(180deg, #edf1f5, #dfe6ee);
      cursor: row-resize;
      touch-action: none;
      position: relative;
    }
    .splitter::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 54px;
      height: 3px;
      border-radius: 999px;
      background: #9ca8b5;
      transform: translate(-50%, -50%);
    }
    .chat-pane {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      background: var(--panel);
    }
    .messages {
      min-height: 0;
      overflow: auto;
      padding: 16px clamp(12px, 3vw, 24px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bubble {
      box-sizing: border-box;
      width: 100%;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      line-height: 1.42;
      background: #f9fafb;
      align-self: flex-start;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .bubble.user {
      background: #e8f1f7;
      border-color: #c4d8e6;
      align-self: flex-end;
    }
    .bubble small {
      display: block;
      color: var(--muted);
      font-weight: 750;
      margin-bottom: 3px;
    }
    .composer {
      border-top: 1px solid var(--line);
      padding: 10px clamp(10px, 2.5vw, 18px);
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      background: rgba(255, 255, 255, .96);
    }
    .attachment-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .attachment-row:empty { display: none; }
    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      background: #fbfcfd;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .compose-grid {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: end;
    }
    .icon-button {
      min-width: 42px;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      display: inline-grid;
      place-items: center;
      font-weight: 850;
    }
    .icon-button.recording {
      color: #fff;
      border-color: var(--danger);
      background: var(--danger);
    }
    .voice-mic-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    #voiceElapsed {
      font-size: 13px;
      font-weight: 750;
      color: var(--danger);
      min-width: 2.5em;
    }
    textarea {
      width: 100%;
      min-height: 42px;
      max-height: 150px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      color: var(--ink);
      background: #fbfcfd;
      outline: none;
    }
    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(47, 111, 159, .12);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/vacation-app-request.js"></script>
  <script type="module">
    import { renderEulaMarkdown } from './src/onboarding/eula-markdown.mjs';
    const root = document.getElementById('root');
    const params = new URLSearchParams(location.search);
    let sessionToken = params.get('session') || params.get('token') || ((eula) => eula.startsWith('vacation-') && !eula.startsWith('vacation-collaborator-') ? eula.slice('vacation-'.length) : '')(params.get('eulaSession') || '') || localStorage.getItem('tsVacationAppSession') || '';
    let state = { session: null, vacations: [], turns: [], currentTripId: '', attachments: [], voiceMode: false, voiceArmed: false, sending: false, eula: null, screen: 'onboarding', things: [], thingId: '', searchProgress: null, progressPollTimer: null, lastProgressUiAt: 0 };
    const safe = (value) => String(value || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    if (!window.tsVacationAppRequest?.failAppRequest) { const m = 'vacation-app-request.js did not load (tsVacationAppRequest missing).'; console.error(m); throw new Error(m); }
    const { customerSafeErrorMessage, showComposerStatus, failAppRequest } = window.tsVacationAppRequest;
    const chatText = (value) => safe(String(value || '').replace(/\*\*([^*\n]+)\*\*/g, '$1').replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?;:]|$)/g, '$1$2'));
    const icon = {
      clip: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m21.4 11.6-8.7 8.7a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.6-8.6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      mic: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" stroke="currentColor" stroke-width="2"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
      check: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m20 6-11 11-5-5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      chevron: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>', send: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    };
    const MAX_INLINE_FILE_BYTES = 2 * 1024 * 1024;
    function realSiteUrl(url, trip) {
      const value = String(url || '').trim();
      if (!value) return '';
      try {
        const parsed = new URL(value, 'https://timesyncher.com');
        if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return '';
        if (!parsed.pathname || parsed.pathname === '/') return '';
        if (/\/shared\/intake-/i.test(parsed.pathname) && !customerPlaceName(trip?.destination)) return '';
        return value;
      } catch {
        return '';
      }
    }
    function embedSiteUrl(url) {
      try {
        const parsed = new URL(url, window.location.href);
        parsed.searchParams.set('embed', '1');
        return parsed.href;
      } catch {
        return url;
      }
    }
    function customerPlaceName(value) {
      const text = String(value || '').trim();
      if (!text || /^(shell|intake)-[a-z0-9]+$/i.test(text)) return '';
      return text;
    }

    function isPlaceholderTrip(trip) {
      if (!trip) return true;
      const destination = customerPlaceName(trip.destination);
      const title = customerPlaceName(trip.title);
      if (destination || trip.startDate || trip.endDate) return false;
      if (title) return false;
      return true;
    }

    function dateParts(value) {
      const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!match) return null;
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return { y: match[1], m: Number(match[2]), d: Number(match[3]), mon: months[Number(match[2]) - 1] };
    }

    function tripDates(trip) {
      const start = dateParts(trip?.startDate);
      const end = dateParts(trip?.endDate);
      if (!start || !end) return '';
      if (start.y !== end.y) return `${start.mon} ${start.d} ${start.y}–${end.mon} ${end.d} ${end.y}`;
      if (start.m !== end.m) return `${start.mon} ${start.d}–${end.mon} ${end.d} ${start.y}`;
      return `${start.mon} ${start.d}–${end.d} ${start.y}`;
    }

    function tripBadge(trip) {
      if (!trip || isPlaceholderTrip(trip)) return '';
      const place = (customerPlaceName(trip.title) || customerPlaceName(trip.destination)).split(',')[0].trim();
      const when = tripDates(trip);
      if (when) return place ? `${place} ${when}` : when;
      return place || '';
    }

    function vacationSelector(trips, trip) {
      if (trips.length < 2) return '';
      const label = (item) => (customerPlaceName(item.title) || customerPlaceName(item.destination)).split(',')[0].trim();
      return `<div class="vacation-dropdown" id="vacationDropdown" data-trip-switcher-root="1"><button class="trip-button" id="tripButton" data-trip-switcher="1" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Switch trip"><span>${safe(tripBadge(trip))}</span>${icon.chevron}</button><div class="trip-list" role="listbox">${trips.map((item) => `<button class="trip-option ${item.id === trip?.id ? 'active' : ''}" type="button" data-trip-id="${safe(item.id)}" role="option" aria-selected="${item.id === trip?.id ? 'true' : 'false'}"><span>${item.id === trip?.id ? icon.check : ''}</span><span><b>${safe(label(item))}</b>${tripDates(item) ? `<small>${safe(tripDates(item))}</small>` : ''}</span></button>`).join('')}</div></div>`;
    }

    function realVacations() {
      return state.vacations.filter((trip) => !isPlaceholderTrip(trip));
    }

    function currentTrip() {
      const trips = realVacations();
      return trips.find((trip) => trip.id === state.currentTripId) || trips[0] || null;
    }

    function renderGate(message = '') {
      root.innerHTML = `<main class="session-gate">
        <section class="gate-card">
          <img class="mark" src="/brand/vk-book-logo.svg" alt="Vacay Keepsake" />
          <h1>Vacay Keepsake</h1>
          ${message ? `<p class="error" role="alert">${safe(message)}</p>` : '<p>Open your vacation workspace with the link from your welcome email.</p>'}
          <form class="session-form" id="sessionForm">
            <input name="session" placeholder="Vacation session token" value="${safe(sessionToken)}" autocomplete="off" required>
            <button>Open app</button>
          </form>
        </section>
      </main>`;
      document.getElementById('sessionForm').addEventListener('submit', (event) => {
        event.preventDefault();
        sessionToken = event.currentTarget.session.value.trim();
        localStorage.setItem('tsVacationAppSession', sessionToken);
        loadApp();
      });
    }

    function renderEula() {
      document.title = 'Review Terms & Privacy';
      const eula = state.eula || {}, name = state.session?.customerName || '', collabSeat = Boolean(state.session?.seat);
      const eulaLead = collabSeat ? 'Agree to join this vacation chat.' : 'These terms are the first step in Vacay Keepsake. Agree to continue into onboarding.', eulaWait = collabSeat ? 'Terms are not ready yet. Open your invite link again in a moment.' : 'Terms are not ready yet. Open the link from your purchase email again in a moment.';
      root.innerHTML = `<main class="app">
        <header class="topbar">
          <div class="brand"><img class="mark" src="/brand/vk-book-logo.svg" alt="Vacay Keepsake" /><span>Vacay Keepsake<small>Terms &amp; Privacy</small></span></div>
        </header>
        <section class="eula-screen" id="eulaScreen" aria-label="Terms and privacy">
          <h1>Review Terms &amp; Privacy</h1>
          <p>${eulaLead}</p>
          <div class="eula-text" id="eulaText">${eula.text ? renderEulaMarkdown(eula.text) : safe(eulaWait)}</div>
          <form class="eula-form" id="eulaForm">
            <label>Your name<input id="eulaName" name="name" type="text" required value="${safe(name)}" autocomplete="name"></label>
            <label><input id="eulaAgree" type="checkbox" required> I agree to Vacay Keepsake's Terms and Privacy Policy and understand the service is advisory-only.</label>
            <button class="agree-button" id="eulaAgreeButton" type="submit">Agree</button>
            <div class="error" id="eulaError" hidden></div>
          </form>
        </section>
      </main>`;
      document.getElementById('eulaForm').addEventListener('submit', acceptEula);
    }
    async function acceptEula(event) {
      event.preventDefault();
      const errorBox = document.getElementById('eulaError');
      const button = document.getElementById('eulaAgreeButton');
      const sessionId = state.eula?.sessionId || '', collabSeat = Boolean(state.session?.seat);
      if (!sessionId) {
        errorBox.hidden = false;
        errorBox.textContent = collabSeat ? 'Terms session is missing. Open your invite link again.' : 'Terms session is missing. Open the link from your purchase email again.';
        return;
      }
      button.disabled = true;
      errorBox.hidden = true;
      try {
        const res = await fetch(`/api/eula?action=accept&sessionId=${encodeURIComponent(sessionId)}`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            acceptedByName: document.getElementById('eulaName').value,
            checkboxConfirmed: document.getElementById('eulaAgree').checked,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.ok === false) throw new Error(data.error || 'Unable to save terms acceptance.');
        state.eula = { ...(state.eula || {}), accepted: true, status: 'accepted' };
        if (state.session?.seat) {
          const joinRes = await fetch(`/api/vacation-itinerary?app=1&session=${encodeURIComponent(sessionToken)}`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ action: 'seat-join' }),
          });
          const joinData = await joinRes.json().catch(() => ({}));
          if (!joinRes.ok || joinData.ok === false) throw new Error(joinData.error || 'Seat join was not stored.');
          if (joinData.status !== 'joined' && joinData.status !== 'already_joined') {
            throw new Error(joinData.error || 'Seat join was not stored.');
          }
        }
        await loadApp();
      } catch (error) {
        errorBox.hidden = false;
        errorBox.textContent = error.message || 'Unable to save terms acceptance.';
        button.disabled = false;
      }
    }

    function renderApp() {
      const trip = currentTrip();
      const trips = realVacations();
      const siteUrl = realSiteUrl(trip?.publicUrl, trip);
      const progressActive = searchProgressActive(trip, siteUrl);
      const hasSite = Boolean(siteUrl);
      const hasTopPane = hasSite || progressActive;
      const chatTurns = state.turns.filter((turn) => turn.speaker !== 'system' && turn.direction !== 'system');
      const turnMarkup = chatTurns.length
        ? chatTurns.map((turn) => {
          const user = turn.speaker === 'customer' || turn.direction === 'inbound';
          if (!String(turn.authorLabel || '').trim()) throw new Error('transcript_author_missing');
          return `<article class="bubble ${user ? 'user' : ''}"><small>${safe(String(turn.authorLabel).trim())}</small>${user ? safe(turn.body) : chatText(turn.body)}</article>`;
        }).join('')
        : '';
      const onboardingPane = `<div class="messages" id="messages" data-screen="onboarding">${turnMarkup}</div><form class="composer" id="composer">
              <p id="composerStatus" role="status" aria-live="polite" hidden style="margin:0 0 8px;color:var(--danger);font-weight:750;font-size:14px"></p>
              <div class="attachment-row" id="attachmentRow"></div>
              <div class="compose-grid">
                <button class="icon-button" id="attachButton" type="button" aria-label="Add file" title="Add file">${icon.clip}</button>
                <textarea id="messageText" name="message" rows="1" aria-label="Message" enterkeyhint="send"></textarea>
                <span class="voice-mic-wrap"><button class="icon-button" id="voiceButton" type="button" aria-label="Speak" title="Speak">${icon.mic}</button><span id="voiceElapsed" hidden aria-live="off"></span></span><button class="icon-button" id="sendButton" type="submit" aria-label="Send" title="Send">${icon.send}</button>
              </div>
              <input id="fileInput" type="file" accept="image/*,video/*,.pdf,.txt,.ics,.csv,.json" multiple hidden>
            </form>`;
      const body = onboardingPane;
      const brandLockup = '<div class="brand vk-app-brand" data-vk-wordmark="1"><img class="mark" src="/brand/vk-book-logo.svg" alt="Vacay Keepsake" width="28" height="30" /><span class="vk-print-wordmark">vacay <i>keepsake</i></span></div>';
      const fullscreenBtn = '<button class="fullscreen-button" id="fullScreenButton" type="button" aria-pressed="false" aria-label="Full screen"><span class="fs-glyph" aria-hidden="true">⛶</span><span class="fs-label">Full screen</span></button>';
      const fullscreenControl = hasSite && trips.length >= 2 ? fullscreenBtn : '';
      const siteFullscreen = hasSite && trips.length < 2 ? fullscreenBtn : '';
      const header = trips.length >= 2
        ? `<header class="topbar" id="appHeader">${brandLockup}${vacationSelector(trips, trip)}${fullscreenControl}</header>`
        : '';
      root.innerHTML = `<main class="app">
        ${header}
        <section class="workspace${hasTopPane ? '' : ' chat-only'}" id="workspace">
          ${hasSite ? `<div class="site-pane"><iframe title="${safe(customerPlaceName(trip.title) || 'Vacation')} website" src="${safe(embedSiteUrl(siteUrl))}"></iframe></div>
          <div class="splitter-row" id="splitterRow"><button class="splitter" id="splitter" type="button" aria-label="Resize website and chat panels"></button>${siteFullscreen}</div>` : ''}
          ${!hasSite && progressActive ? `<div class="site-pane" id="searchProgressPane"><div class="search-progress" id="searchProgress" aria-live="polite"><div class="search-progress-rows" id="searchProgressRows"></div><p class="search-progress-status" id="searchProgressStatus" hidden>Building itinerary…</p></div></div>
          <button class="splitter" id="splitter" type="button" aria-label="Resize search progress and chat panels"></button>` : ''}
          <section class="chat-pane" aria-label="Vacation chat">
            ${body}
          </section>
        </section>
      </main>`;
      bindApp();
      renderAttachments();
      if (progressActive && state.searchProgress) paintSearchProgress(state.searchProgress);
    }

    function bindApp() {
      const menu = document.getElementById('vacationDropdown');
      const button = document.getElementById('tripButton');
      if (menu && button) {
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          const open = !menu.classList.contains('open');
          menu.classList.toggle('open', open);
          button.setAttribute('aria-expanded', String(open));
        });
        document.addEventListener('click', () => {
          menu.classList.remove('open');
          button.setAttribute('aria-expanded', 'false');
        });
        document.querySelectorAll('.trip-option').forEach((option) => {
          option.addEventListener('click', () => {
            state.currentTripId = option.dataset.tripId;
            state.turns = [];
            loadApp(state.currentTripId);
          });
        });
      }
      if (document.getElementById('splitter')) window.tsVacationAppChrome.bindSplitter();
      window.tsVacationAppChrome.bindFullScreen();
      const attachButton = document.getElementById('attachButton');
      const messageText = document.getElementById('messageText');
      const composer = document.getElementById('composer');
      if (!attachButton || !messageText || !composer) return;
      attachButton.addEventListener('click', () => document.getElementById('fileInput').click());
      document.getElementById('fileInput').addEventListener('change', (event) => {
        state.attachments = Array.from(event.target.files || []).slice(0, 6);
        renderAttachments();
        messageText.focus();
      });
      window.tsVacationAppChrome.bindVoice(getState);
      let shiftBreak = false, imeBreak = false;
      const enterSend = (event, fromBreak) => {
        const skip = shiftBreak || imeBreak || event.isComposing === true || event.keyCode === 229 || event.shiftKey === true || event.repeat;
        if (fromBreak) { shiftBreak = false; imeBreak = false; }
        if (skip || (!messageText.value.trim() && !state.attachments.length && !state.sending)) return;
        event.preventDefault(); if (!state.sending) composer.requestSubmit();
      };
      messageText.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter') return;
        shiftBreak = event.shiftKey === true; imeBreak = event.isComposing === true || event.keyCode === 229;
        enterSend(event, false);
      });
      messageText.addEventListener('beforeinput', (event) => {
        if (event.inputType === 'insertLineBreak' || event.inputType === 'insertParagraph') enterSend(event, true);
      });
      composer.addEventListener('submit', sendMessage);
    }

    function renderAttachments() {
      const row = document.getElementById('attachmentRow');
      if (!row) return;
      row.innerHTML = state.attachments.map((file) => `<span class="chip">${safe(file.name)} · ${Math.ceil(file.size / 1024)} KB</span>`).join('');
    }

    async function sendMessage(event) {
      event.preventDefault();
      if (state.sending) { document.getElementById('messageText')?.focus(); return; }
      const textarea = document.getElementById('messageText');
      const text = textarea.value.trim();
      if (!text && state.attachments.length === 0) { textarea.focus(); return; }
      showComposerStatus('');
      state.sending = true;
      const hadSite = Boolean(realSiteUrl(currentTrip()?.publicUrl, currentTrip()));
      const voiceTurn = state.voiceArmed === true;
      state.voiceArmed = false;
      const messages = document.getElementById('messages');
      messages.insertAdjacentHTML('beforeend', `<article class="bubble user"><small>You</small>${safe(text || 'Vacation files attached')}</article>`);
      textarea.value = ''; textarea.focus();
      const attachments = await Promise.all(state.attachments.map(filePayload));
      state.attachments = [];
      renderAttachments();
      messages.insertAdjacentHTML('beforeend', `<article class="bubble" id="tsTyping" aria-live="polite" aria-busy="true"><small>Vacay Keepsake</small>…</article>`);
      if (!hadSite && currentTrip()?.id) startProgressPoll(currentTrip().id);
      const sendAbort = window.tsVacationAppRequest.beginChatSendAbort();
      try {
        const res = await fetch(`/api/vacation-itinerary?app=1&session=${encodeURIComponent(sessionToken)}`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          signal: sendAbort.signal,
          body: JSON.stringify({
            tripId: currentTrip()?.id,
            text,
            attachments,
            voiceMode: voiceTurn,
            browserTranscription: voiceTurn,
          }),
        });
        const data = await res.json();
        if (!res.ok || data.ok === false) failAppRequest(data, 'The app did not return a reply.');
        if (data.status === 'interim') {
          const typing = document.getElementById('tsTyping');
          if (data.interimReply?.text && typing) {
            typing.insertAdjacentHTML('beforebegin', `<article class="bubble"><small>Vacay Keepsake</small>${chatText(data.interimReply.text)}</article>`);
          }
          const finRes = await fetch(`/api/vacation-itinerary?app=1&session=${encodeURIComponent(sessionToken)}`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ action: 'finish-rewrite', tripId: currentTrip()?.id }),
          });
          const fin = await finRes.json();
          document.getElementById('tsTyping')?.remove();
          if (!finRes.ok || fin.ok === false || !fin.reply) failAppRequest(fin, 'The app did not return a reply.');
          if (Array.isArray(fin.itinerary)) state.things = fin.itinerary;
          messages.insertAdjacentHTML('beforeend', `<article class="bubble"><small>Vacay Keepsake</small>${chatText(fin.reply)}</article>`);
        } else {
          document.getElementById('tsTyping')?.remove();
          if (!data.reply) failAppRequest(data, 'The app did not return a reply.');
          if (Array.isArray(data.itinerary)) state.things = data.itinerary;
          if (data.vacation?.id) {
            const index = state.vacations.findIndex((item) => item.id === data.vacation.id);
            if (index >= 0) state.vacations[index] = data.vacation;
            else state.vacations.push(data.vacation);
            const tripButton = document.getElementById('tripButton');
            const tripLabelSpan = tripButton?.querySelector('span');
            if (tripLabelSpan) tripLabelSpan.textContent = tripBadge(data.vacation);
            if (!hadSite && realSiteUrl(data.vacation.publicUrl, data.vacation)) {
              stopProgressPoll();
              await loadApp(data.vacation.id);
              return;
            }
          }
          if (data.searchProgress) applyServerProgress(data.searchProgress, data.vacation || data.trip, data.vacation?.publicUrl);
          messages.insertAdjacentHTML('beforeend', `<article class="bubble"><small>Vacay Keepsake</small>${chatText(data.reply)}</article>`);
        }
      } catch (error) {
        document.getElementById('tsTyping')?.remove();
        console.error(error);
        if (error?.name === 'AbortError') {
          messages.insertAdjacentHTML('beforeend', '<article class="bubble" role="alert"><small>TimeSyncher</small>That took too long — please try again.</article>');
          showComposerStatus('');
        } else {
          showComposerStatus(customerSafeErrorMessage(error, error?.response));
        }
        stopProgressPoll();
      } finally {
        sendAbort.clear();
        state.sending = false;
      }
      messages.scrollTop = messages.scrollHeight;
    }

    function filePayload(file) {
      const base = { name: file.name, type: file.type, size: file.size, lastModified: file.lastModified, inline: file.size <= MAX_INLINE_FILE_BYTES };
      if (file.size > MAX_INLINE_FILE_BYTES) return Promise.resolve({ ...base, contentDataUrl: null, note: 'File is larger than inline web app intake limit.' });
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve({ ...base, contentDataUrl: String(reader.result || '') });
        reader.onerror = () => resolve({ ...base, contentDataUrl: null, note: 'Browser could not read this file.' });
        reader.readAsDataURL(file);
      });
    }

    async function loadApp(tripId = '') {
      if (!sessionToken) return renderGate();
      try {
        const query = new URLSearchParams({ app: '1', session: sessionToken });
        if (tripId) query.set('tripId', tripId);
        const res = await fetch(`/api/vacation-itinerary?${query.toString()}`);
        const data = await res.json();
        if (!res.ok || data.ok === false) throw new Error([data.code, data.reason || data.error].filter(Boolean).join(': ') || 'Unable to open app.');
        localStorage.setItem('tsVacationAppSession', sessionToken);
        state.session = data.session;
        state.eula = data.eula || null;
        state.vacations = data.vacations || [];
        state.turns = data.turns || [];
        state.things = Array.isArray(data.itinerary) ? data.itinerary : [];
        state.searchProgress = data.searchProgress || null;
        state.currentTripId = window.tsVacationAppRequest.resolveCurrentTripId({
          vacations: data.vacations,
          tripId,
          urlTripId: params.get('tripId') || '',
          sessionTripId: data.session?.currentTripId,
          fallbackTripId: state.vacations[0]?.id || '',
        });
        if (state.eula?.accepted !== true) {
          renderEula();
          return;
        }
        renderApp();
      } catch (error) {
        renderGate(error.message);
      }
    }
    const setState = (patch) => {
      state = { ...state, ...patch };
    };
    const getState = () => state;
    const getSessionToken = () => sessionToken;
    const {
      searchProgressActive,
      stopProgressPoll,
      startProgressPoll,
      applyServerProgress,
      paintSearchProgress,
    } = window.tsVacationAppProgress.attach({ getState, setState, getSessionToken, loadApp, currentTrip, realSiteUrl });
    loadApp(window.tsVacationAppRequest.initialTripIdFromSearch(params));
  </script></body>
</html>
